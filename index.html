<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Fellow</title>
  <style>
    /* Newsroom style: see "Site style" in CLAUDE.md before changing. */
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #555555;
      --rule: #dddddd;
      --accent: #8b0000; /* the one accent color: dark red */
      --serif: Georgia, "Times New Roman", Times, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 1.125rem;
      line-height: 1.65;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 6rem 1rem 8rem;
    }

    /* Masthead */
    header {
      border-bottom: 3px solid var(--text);
      padding-bottom: 2rem;
      margin-bottom: 4rem;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0 0 1rem;
    }
    .beat {
      margin: 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.35rem;
      color: var(--muted);
    }

    /* Sections */
    section { margin-bottom: 4.5rem; }
    h2 {
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border-top: 1px solid var(--text);
      padding-top: 0.75rem;
      margin: 0 0 1.75rem;
    }
    a {
      color: var(--text);
      text-decoration-color: var(--accent);
      text-underline-offset: 0.2em;
    }
    a:hover, a:focus { color: var(--accent); }

    /* Clips: one story per row, headline then outlet and date */
    .clips { list-style: none; padding: 0; margin: 0; }
    .clips li {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .clips li:first-child { padding-top: 0; }
    .clips a {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.3;
      text-decoration: none;
    }
    .clips a:hover, .clips a:focus { text-decoration: underline; }
    .clip-outlet {
      display: inline-block;
      margin-top: 0.4rem;
      font-family: var(--sans);
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Placeholders for content still to come. Remove when filled in. */
    .todo {
      border: 1px dashed var(--muted);
      background: #f5f5f5;
      padding: 0.75rem 1rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--muted);
    }
    .todo-inline {
      border: 1px dashed var(--muted);
      background: #f5f5f5;
      padding: 0 0.3rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Test Fellow</h1>
      <p class="beat">Reporting fellow covering health care</p>
    </header>

    <section id="about">
      <h2>About</h2>
      <!-- TODO: About text goes here. Waiting for Test Fellow to provide it. -->
      <p class="todo">[ABOUT TEXT GOES HERE — to be provided]</p>
    </section>

    <section id="clips">
      <h2>Clips</h2>
      <!--
        Add stories here, newest first. Copy this pattern for each one:
        <li>
          <a href="STORY URL">HEADLINE</a><br>
          <span class="clip-outlet">OUTLET · DATE</span>
        </li>
      -->
      <ul class="clips">
        <li>
          <a href="https://www.hackshackers.com/voter-guide-commons/">People are asking AI who to vote for. We built a way for newsroom voter guides to answer</a><br>
          <span class="clip-outlet">Hacks/Hackers · Oct. 12, 2026</span>
        </li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <!-- TODO: Replace the placeholder with the real email address. -->
      <p>You can reach me at <span class="todo-inline">[EMAIL]</span>.</p>
    </section>
  </main>
</body>
</html>
